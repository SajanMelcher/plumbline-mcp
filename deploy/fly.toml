# Fly.io config for the hosted HTTP endpoint. NOTHING IS DEPLOYED BY THIS FILE.
# Payments stay OFF unless the payment env (PAYTO_ADDRESS etc.) is imported as Fly secrets; see deploy/DEPLOY.md.
# The payee address is never stored in this repo.
app = "plumbline-mcp"            # change if the name is taken
primary_region = "sjc"           # San Jose: nearest US-West region (~$2.61/mo for shared-cpu-1x 256MB always-on; iad is $2.19)

[build]
  dockerfile = "Dockerfile"      # deploy/Dockerfile (paths are relative to this file)

[env]
  TRANSPORT = "http"
  HOST = "0.0.0.0"
  PORT = "8080"
  PLUMBLINE_STATE_FILE = "/data/plumbline-state.json"
  PLUMBLINE_CLIENT_IP_HEADER = "fly-client-ip"   # set by Fly's edge, overwritten on every request
  PLUMBLINE_RATE_LIMIT_PER_MIN = "120"

[[mounts]]
  source = "plumbline_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Exactly ONE machine (payment state is a local file on the volume). It may SUSPEND when idle to save cost:
  # a suspended machine resumes from a memory snapshot in well under a second, so the first MCP request after idle
  # is held by Fly's proxy and answered. Payment state is fsync'd on every change.
  # For always-on: auto_stop_machines = "off" + min_machines_running = 1.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
